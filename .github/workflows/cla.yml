# Every outside pull request needs the Contributor License Agreement signed once (CLA.md). The check comments on
# the pull request, records the signature in .github/cla/signatures.json on the cla-signatures branch, and sets
# the pull request's status. `pull_request_target` is the trigger the action requires; nothing from the pull
# request is checked out or run here, the action is pinned to a commit, and the token's write permissions are
# the ones it needs to comment, set the status and commit the signature file.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Contributor License Agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla/signatures.json"
          path-to-document: "https://github.com/drathm/okf-catalog/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "drathm,dependabot[bot],github-actions[bot]"
          create-file-commit-message: "cla: signature file"
          signed-commit-message: "cla: $contributorName has signed"
          custom-notsigned-prcomment: "Thank you for the pull request. Before it can be merged, please read CLA.md and sign it by replying with the sentence below. One signature covers every later pull request."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "Every contributor on this pull request has signed the CLA."
          lock-pullrequest-aftermerge: "false"
