# Copy this file into the repository that holds the company's bundle, as .github/workflows/publish.yml, and set the
# four values under `env`. It runs on a push to the source branch, never on the published branch; a read-only job
# checks and packs, and a second job with the write token runs git alone. See README.md beside this file.
name: publish knowledge bundle

on:
  push:
    branches:
      - main # the source branch; never the published branch

permissions: {}

concurrency:
  group: okf-catalog-publish
  cancel-in-progress: false

env:
  BUNDLE_PATH: kb
  CONFIG_PATH: okf-catalog.yaml
  PUBLISHED_BRANCH: published
  # The server package from a pinned commit of its repository, never a bare package name (the npm name is unclaimed).
  OKF_CATALOG_SOURCE: "github:drathm/okf-catalog#0000000000000000000000000000000000000000"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.pack.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: install the checkers, pinned
        run: |
          uv venv "$RUNNER_TEMP/checkers"
          uv pip install --python "$RUNNER_TEMP/checkers/bin/python" --require-hashes -r recipes/publish/checkers.lock
          echo "$RUNNER_TEMP/checkers/bin" >> "$GITHUB_PATH"
      - name: install the server package from its pinned source
        run: npm install --global "$OKF_CATALOG_SOURCE"
      - name: check, pack, check
        id: pack
        run: |
          commit=$(sh recipes/publish/pack.sh --config "$CONFIG_PATH" --source "$BUNDLE_PATH" --out "$RUNNER_TEMP/bundle" --commit "$GITHUB_SHA")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: bundle
          path: ${{ runner.temp }}/bundle
      - name: commit the bundle onto the published branch and push
        env:
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: sh recipes/publish/push.sh --repo "$GITHUB_WORKSPACE" --bundle "$RUNNER_TEMP/bundle" --commit "$SOURCE_COMMIT" --branch "$PUBLISHED_BRANCH"
